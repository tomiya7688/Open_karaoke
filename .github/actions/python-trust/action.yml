name: Python trust tooling
description: >-
  Upgrade pip and certifi to the minimum versions required by the Python trust-store
  incident response (#66), then print and verify the Python environment's trust sources.
runs:
  using: composite
  steps:
    - name: Upgrade pip and certifi, verify trust tooling
      shell: bash
      run: |
        python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"
        python "$GITHUB_WORKSPACE/scripts/check_python_trust.py"
