name: Full-song regression

on:
  push:
    branches: [main]
    paths: ['python/**', 'core/src/song_data.rs', 'core/tests/**', '.github/workflows/song-regression.yml']
  pull_request:
    paths: ['python/**', 'core/src/song_data.rs', 'core/tests/**', '.github/workflows/song-regression.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: song-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  song-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: ./.github/actions/python-trust
      - name: Install existing analysis test dependencies
        run: python -m pip install -e './python[dev]'
      - name: Pipeline, failure, cancellation and real downstream algorithms
        run: python -m pytest python/tests/test_song.py python/tests/test_service.py python/tests/test_note_window_contract.py -q --junitxml=artifacts/song-tests.xml
      - name: Python result to Rust SongStore document contract
        run: cargo test --locked --test song_bundle_contract -- --ignored
      - name: Python formatting with read-only diff diagnostics
        run: python -m ruff format --diff python/src/open_karaoke_analysis/song.py python/tests/test_song.py python/tests/emit_song_bundle.py
      - name: Retain synthetic contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: song-contracts-${{ matrix.os }}
          path: artifacts/song-tests.xml
          if-no-files-found: error
