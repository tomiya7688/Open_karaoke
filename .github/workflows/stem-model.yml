name: Stem model integration
on:
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/stem-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching CPU model runtime
        run: |
          python -m pip install torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1
          python -m pip install -e './python[dev,stems]'
      - name: Separate with real publisher weights and record metrics
        env:
          OPEN_KARAOKE_REAL_STEMS: '1'
          OPEN_KARAOKE_METRICS_DIR: artifacts/stems
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m pytest python/tests/test_stem_real_model.py -v -s
      - name: Upload real-model metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stem-model-metrics
          path: artifacts/stems
          if-no-files-found: error
