name: Finalize Issue 6 source checks
on:
  push:
    branches: [issue-6-stem-separation]
    paths: [.github/workflows/prepare-issue6.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-6-stem-separation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve two line-length findings
        shell: python
        run: |
          from pathlib import Path
          path = Path('python/src/open_karaoke_analysis/stem_audio.py')
          text = path.read_text()
          old = '# Preserve the original mixture, including frequencies above the model bandwidth.'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '# Preserve the mixture, including energy above the model bandwidth.'))
          path = Path('python/tests/test_stems.py')
          text = path.read_text()
          old = '"StemsAdapter(); assert not '
          assert text.count(old) == 1
          path.write_text(text.replace(old, '"StemsAdapter(); assert not "\n        "'))
      - name: Install tools and format
        run: |
          python -m pip install -e './python[dev]'
          python -m ruff format python
          python -m ruff check python
      - name: Run service and numerical tests
        run: python -m pytest python/tests -q
      - name: Commit checked corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add python
          git commit -m 'style: resolve stem pipeline lint diagnostics'
          git push origin HEAD:refs/heads/issue-6-stem-separation
