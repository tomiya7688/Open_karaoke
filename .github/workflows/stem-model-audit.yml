name: Stem model provenance audit
on:
  push:
    branches: [issue-6-stem-separation]
    paths: [.github/workflows/stem-model-audit.yml]
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read upstream weight license and compute digest
        shell: python
        run: |
          import hashlib, json, urllib.request
          url = 'https://zenodo.org/api/records/3370489'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = json.load(response)
          print('MODEL_RECORD', json.dumps(data['metadata'], sort_keys=True))
          item = next(f for f in data['files'] if f['key'] == 'vocals-b62c91ce.pth')
          print('WEIGHT_RECORD', json.dumps(item, sort_keys=True))
          with urllib.request.urlopen(item['links']['self'], timeout=120) as response:
              content = response.read()
          print('WEIGHT_SHA256', hashlib.sha256(content).hexdigest())
          print('WEIGHT_MD5', hashlib.md5(content).hexdigest())
