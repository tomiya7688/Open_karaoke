name: Pitch regression

on:
  pull_request:
    paths:
      - 'python/**'
      - 'docs/pitch_analysis.md'
      - '.github/workflows/pitch-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pitch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pitch test dependencies
        run: python -m pip install --quiet -e './python[dev,pitch]'
      - name: Static diagnostics
        run: |
          mkdir -p artifacts/pitch
          python -m ruff check python --output-format concise > artifacts/pitch/lint.txt
          python -m ruff format --check --diff python > artifacts/pitch/format.patch
      - name: Pitch contracts and synthetic regressions
        run: |
          python -m pytest python/tests/test_pitch.py python/tests/test_pitch_evaluator.py -q --junitxml=artifacts/pitch/tests.xml
          open-karaoke-pitch-evaluator \
            --output artifacts/pitch/regression.json \
            --max-ensemble-median-cents 5 \
            --max-ensemble-gross-rate 0.05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitch-regression
          path: artifacts/pitch
          if-no-files-found: error
