name: Desktop session integration

on:
  push:
    branches: [main]
    paths: ['core/**', 'gui/**', 'python/**', 'Cargo.*', '.github/workflows/desktop-integration.yml']
  pull_request:
    paths: ['core/**', 'gui/**', 'python/**', 'Cargo.*', '.github/workflows/desktop-integration.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Japanese fonts for UI rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install the real supervised worker
        run: python -m pip install -e './python[dev]'
      - name: Build real Core executable
        run: cargo build --locked -p open-karaoke-core
      - name: Build Avalonia GUI and client
        run: dotnet build gui/OpenKaraoke.Gui/OpenKaraoke.Gui.csproj --configuration Release
      - name: Client contracts and real Core-Python session lifecycle
        run: >-
          python -c "import pathlib,subprocess,sys; core=pathlib.Path('target/debug/open-karaoke-core'+('.exe' if sys.platform=='win32' else '')).resolve(); subprocess.run(['dotnet','run','--project','gui/OpenKaraoke.Client.Tests','--configuration','Release','--',str(core),sys.executable],check=True)"
      - name: Actual XAML and headless GUI-to-Core workflow
        run: >-
          python -c "import pathlib,subprocess,sys; core=pathlib.Path('target/debug/open-karaoke-core'+('.exe' if sys.platform=='win32' else '')).resolve(); subprocess.run(['dotnet','run','--project','gui/OpenKaraoke.Gui.Smoke','--configuration','Release','--','artifacts/desktop-smoke',str(core),sys.executable],check=True)"
      - name: Retain rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-${{ matrix.os }}
          path: artifacts/desktop-smoke/*.png
          if-no-files-found: warn
      - name: Check unchanged dependency lock
        run: git diff --exit-code -- Cargo.lock
