name: CI

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Python package and tools
        shell: pwsh
        run: python -m pip install -e "./python[dev]"
      - name: Check all components
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build dependency inventory
        shell: pwsh
        run: ./scripts/dependency-inventory.ps1
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: artifacts/dependencies
