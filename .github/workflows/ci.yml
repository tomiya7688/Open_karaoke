name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python package and tools
        run: python -m pip install -e './python[dev]'
      - name: Python lint and format
        run: |
          python -m ruff check python
          python -m ruff format --check python
      - name: Python contract and process tests
        run: python -m pytest python/tests -q --junitxml=artifacts/python-tests.xml
      - name: Rust format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust unit and API tests
        run: cargo test --locked --workspace --all-targets
      - name: Core to Python lifecycle and crash recovery
        run: cargo test --locked --test job_api -- --ignored --nocapture
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-report
          path: artifacts/python-tests.xml
          if-no-files-found: ignore

  windows-build-and-check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check Rust, Python, process integration and Avalonia build
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build dependency inventory
        shell: pwsh
        run: ./scripts/dependency-inventory.ps1
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: windows-dependency-inventory
          path: artifacts/dependencies
