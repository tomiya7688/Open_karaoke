name: Prepare Issue 5 sources
on:
  push:
    branches: [issue-5-analysis-service]
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.head_commit.message == 'build: materialize issue 5 source bundle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-5-analysis-service
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Materialize verified source files
        shell: python
        run: |
          import base64, hashlib, json, lzma
          from pathlib import Path
          packed = base64.b64decode(''.join(Path(f'.ci-issue5/part{i}.b64').read_text().strip() for i in range(5)), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '54f377c6607e2d1261eb0928aaa90c8ce48fc8f5e38920d3f44fb21bf4e16614'
          sources = json.loads(lzma.decompress(packed))
          allowed = {'core/Cargo.toml', 'core/src/analysis_service.rs', 'core/src/lib.rs', 'core/src/main.rs', 'core/tests/job_api.rs', 'docs/analysis_service.md', 'python/pyproject.toml', 'python/src/open_karaoke_analysis/__init__.py', 'python/src/open_karaoke_analysis/__main__.py', 'python/src/open_karaoke_analysis/adapters.py', 'python/src/open_karaoke_analysis/contracts.py', 'python/src/open_karaoke_analysis/service.py', 'python/tests/test_process.py', 'python/tests/test_service.py', 'scripts/check.ps1'}
          assert set(sources) == allowed
          for name, content in sources.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8', newline='\n')
          # Repair a literal LF accidentally embedded in a Rust byte literal by the earlier PR.
          path = Path('core/src/song_data.rs')
          text = path.read_text()
          assert "bytes.push(b'\n');" in text
          path.write_text(text.replace("bytes.push(b'\n');", "bytes.push(b'\\n');"))
          # Document existing public fallible APIs rather than weakening the lint gate.
          docs = {
            'core/src/song_data.rs': {
              '    pub fn validate(': 'Validate the bundle.\n\n# Errors\nReturns collected schema, timeline, path and reference violations.',
              '    pub fn save(': 'Persist a validated bundle.\n\n# Errors\nReturns validation, serialization or filesystem errors.',
              '    pub fn load(': 'Load and validate all song documents.\n\n# Errors\nReturns filesystem, JSON, migration or validation errors.',
              'pub fn migrate_document(': 'Migrate legacy document fields.\n\n# Errors\nReturns an error for non-object legacy documents or unsupported versions.'
            },
            'core/src/audio_import.rs': {
              'pub fn normalize_audio(': 'Normalize supported input to the internal WAV format.\n\n# Errors\nReturns input, distribution-policy, process, probe or filesystem errors.',
              'pub fn verify_ffmpeg_distribution(': 'Inspect the configured FFmpeg executable.\n\n# Errors\nReturns process failures or violations of the selected distribution policy.',
              'pub fn validate_ffmpeg_build_configuration(': 'Validate the selected FFmpeg build policy.\n\n# Errors\nRejects GPL-enabled and nonfree-enabled configurations under this policy.',
              'pub fn probe_audio(': 'Probe audio stream metadata.\n\n# Errors\nReturns process failures or invalid probe output.',
              'pub fn parse_probe_json(': 'Decode required integer stream metadata.\n\n# Errors\nRejects malformed JSON, missing fields and out-of-range integer values.'
            }
          }
          for name, functions in docs.items():
              path = Path(name)
              text = path.read_text()
              for signature, comment in functions.items():
                  assert signature in text
                  indent = signature[:len(signature)-len(signature.lstrip())]
                  prefix = ''.join(indent + '/// ' + line + '\n' for line in comment.split('\n'))
                  text = text.replace(signature, prefix + signature, 1)
              path.write_text(text)
          for name in ['scripts/build.ps1', 'scripts/dependency-inventory.ps1']:
              path = Path(name)
              text = path.read_text().replace('$ErrorActionPreference = "Stop"', '$ErrorActionPreference = "Stop"\n$PSNativeCommandUseErrorActionPreference = $true')
              path.write_text('#requires -Version 7.4\n' + text)
          path = Path('.gitignore')
          path.write_text(path.read_text() + '\n.pytest_cache/\n.ruff_cache/\n*.egg-info/\n')
          path = Path('README.md')
          path.write_text(path.read_text() + '\n- [Python Analysis Service](docs/analysis_service.md)\n')
      - name: Install Python development dependencies
        run: python -m pip install -e './python[dev]'
      - name: Format source
        run: |
          python -m ruff check --select I --fix python
          python -m ruff format python
          cargo fmt --all
      - name: Commit materialized and formatted source to implementation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core python scripts docs README.md .gitignore Cargo.lock
          git commit -m 'feat: implement supervised Python Analysis Service and contract tests'
          git push origin HEAD:refs/heads/issue-5-analysis-service
      - name: Python lint
        if: success()
        run: python -m ruff check python
      - name: Python tests
        if: '!cancelled()'
        run: python -m pytest python/tests -q
      - name: Rust static analysis
        if: '!cancelled()'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        if: '!cancelled()'
        run: cargo test --workspace --all-targets
      - name: Core to Python lifecycle and crash recovery
        if: '!cancelled()'
        run: cargo test --test job_api -- --ignored --nocapture
