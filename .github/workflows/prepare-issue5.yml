name: Repair Issue 5 diagnostics
on:
  push:
    branches: [issue-5-analysis-service]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'repair issue 5 diagnostics')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-5-analysis-service
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply reviewed diagnostics
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'python/src/open_karaoke_analysis/contracts.py': [
              ('from enum import Enum', 'from enum import StrEnum'),
              ('class Role(str, Enum):', 'class Role(StrEnum):')
            ],
            'python/src/open_karaoke_analysis/service.py': [
              ('from datetime import datetime, timezone', 'from datetime import UTC, datetime'),
              ('datetime.now(timezone.utc)', 'datetime.now(UTC)'),
              ('.encode("utf-8")', '.encode()')
            ],
            'core/src/audio_import.rs': [
              ('/// Inspect the configured FFmpeg executable.', '/// Inspect the configured `FFmpeg` executable.'),
              ('/// Validate the selected FFmpeg build policy.', '/// Validate the selected `FFmpeg` build policy.'),
              ('artifacts: Default::default(),', 'artifacts: std::collections::BTreeMap::new(),')
            ],
            'core/src/song_data.rs': [
              ('Value::Object(Default::default())', 'Value::Object(serde_json::Map::new())')
            ],
            'core/src/lib.rs': [
              ('#[must_use]\npub fn app(', 'pub fn app('),
              ('job.stage = "running".to_owned();', '"running".clone_into(&mut job.stage);'),
              ('job.stage = match status {\n                JobStatus::Completed => "completed",\n                JobStatus::Cancelled => "cancelled",\n                _ => "failed",\n            }\n            .to_owned();', 'match status {\n                JobStatus::Completed => "completed",\n                JobStatus::Cancelled => "cancelled",\n                _ => "failed",\n            }.clone_into(&mut job.stage);')
            ],
            'core/tests/job_api.rs': [
              ('if let Ok(next) = client.health().await {\n            if next["instance_id"] != health["instance_id"] {\n                break;\n            }\n        }', 'if let Ok(next) = client.health().await\n            && next["instance_id"] != health["instance_id"]\n        {\n            break;\n        }')
            ]
          }
          for name, changes in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in changes:
                  assert old in text, (name, old)
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8', newline='\n')
      - name: Install Python tools
        run: python -m pip install -e './python[dev]'
      - name: Format
        run: |
          python -m ruff check --select I --fix python
          python -m ruff format python
          cargo fmt --all
      - name: Commit source corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core python
          git commit -m 'fix: resolve Python and Rust static analysis diagnostics'
          git push origin HEAD:refs/heads/issue-5-analysis-service
      - name: Python lint and tests
        if: '!cancelled()'
        run: |
          python -m ruff check python
          python -m ruff format --check python
          python -m pytest python/tests -q
      - name: Rust lint
        if: '!cancelled()'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests and Python process integration
        if: '!cancelled()'
        run: |
          cargo test --locked --workspace --all-targets
          cargo test --locked --test job_api -- --ignored --nocapture
