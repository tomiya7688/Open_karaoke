name: Lyric CER regression

on:
    push:
        branches: [main]
        paths:
            - 'python/**'
            - 'package*.json'
            - '.prettierrc.json'
            - 'docs/lyric_ci.md'
            - '.github/workflows/lyric-regression.yml'
    pull_request:
        paths:
            - 'python/**'
            - 'package*.json'
            - '.prettierrc.json'
            - 'docs/lyric_ci.md'
            - '.github/workflows/lyric-regression.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lyric-cer-regression:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - name: Install development tools
              run: |
                  python -m pip install --quiet -e './python[dev]'
                  npm ci --ignore-scripts --no-audit --no-fund
            - name: Check scoped formatting
              run: npm run format:check:lyric-ci
            - name: Test fixed baseline and failure contracts
              run: python -m pytest python/tests/test_lyric_ci.py python/tests/test_lyric_regression.py -q
            - name: Generate synthetic candidate summary
              id: evaluate
              run: >-
                  python -m open_karaoke_analysis.lyric_evaluator
                  python/tests/fixtures/lyric_ci_pairs.json
                  --output artifacts/lyric-ci/detail.json
                  --summary-output artifacts/lyric-ci/candidate.json
                  --dataset-id lyric-ci --dataset-version v1
                  --model-name synthetic-fixture --model-version v1
                  --evaluation-kind synthetic --max-cer 0.1
            - name: Compare against reviewed baseline
              if: ${{ success() || (failure() && steps.evaluate.outcome == 'failure') }}
              run: >-
                  python -m open_karaoke_analysis.lyric_regression
                  python/tests/fixtures/lyric_ci_baseline.json
                  artifacts/lyric-ci/candidate.json
                  --output artifacts/lyric-ci/regression.json
                  --max-cer-increase 0
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: lyric-cer-synthetic-metrics
                  path: |
                      artifacts/lyric-ci/candidate.json
                      artifacts/lyric-ci/regression.json
                  if-no-files-found: error
                  retention-days: 14
