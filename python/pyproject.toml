[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-karaoke-analysis"
version = "0.1.0"
description = "Offline analysis service for Open_karaoke"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1", "pytest>=8,<10", "httpx>=0.27,<1",
    "numpy>=1.26,<3", "scipy>=1.11,<2", "soundfile>=0.13,<1",
]
stems = [
    "openunmix==1.3.0", "torch>=2.6,<3", "torchaudio>=2.6,<3",
    "numpy>=1.26,<3", "scipy>=1.11,<2", "soundfile>=0.13,<1",
]
lyrics = [
    "openai-whisper==20250625", "torch>=2.6,<3",
    "numpy>=1.26,<3", "scipy>=1.11,<2", "soundfile>=0.13,<1",
]

[project.scripts]
open-karaoke-analysis = "open_karaoke_analysis.__main__:main"
open-karaoke-stem-evaluator = "open_karaoke_analysis.stem_evaluator:main"
open-karaoke-lyric-evaluator = "open_karaoke_analysis.lyric_evaluator:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
